<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- La app es solo modo oscuro: el atributo va fijo en el propio HTML, así
         que se aplica antes del primer pintado sin necesidad de script.
         El selector claro/oscuro sigue existiendo en src/store/themeStore.ts
         pero no se importa desde main.tsx — ver el comentario de ahí. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8B5CF6" />
    <meta name="description" content="Roady — Aprende y practica el examen teórico del permiso B con contenido basado en fuentes oficiales de la DGT." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Roady" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Solo para el wordmark del logotipo. El resto de la interfaz usa la
         fuente del sistema y no descarga nada. Un único peso: 800 itálica. -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800&display=swap" rel="stylesheet" />
    <title>Roady — Permiso B</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
